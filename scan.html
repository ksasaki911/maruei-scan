<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a237e">
<link rel="manifest" href="/manifest.json">
<title>マルエー商品スキャン</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pri:#1a237e;--pri2:#283593;--bg:#f5f5f5;--card:#fff;--txt:#212121;--txt2:#757575;--green:#2e7d32;--red:#c62828;--blue:#1565c0;--amber:#f57f17;--border:#e0e0e0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;-webkit-text-size-adjust:100%}
.header{background:var(--pri);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header h1{font-size:15px;font-weight:600;letter-spacing:.5px}
.header .store-sel{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:4px 8px;font-size:12px}
.header .store-sel option{color:#000;background:#fff}

/* スキャンエリア（コンパクト版） */
.scan-area-compact{background:#000;position:relative;overflow:hidden;height:200px}
#qr-reader{width:100%!important;height:200px!important}
#qr-reader video{width:100%!important;height:200px!important;object-fit:cover}
#qr-reader__dashboard{display:none!important}
.scan-hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#fff;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.7);z-index:10}

/* スキャン成功バナー */
.scan-success-banner{display:none;background:#2e7d32;color:#fff;padding:8px 16px;text-align:center;font-size:14px;font-weight:700;animation:flashBg .3s ease-in-out}
.scan-success-banner.show{display:block}
@keyframes flashBg{0%{background:#4caf50}50%{background:#1b5e20}100%{background:#2e7d32}}

/* 手動入力 */
.manual-input{display:flex;gap:8px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--border)}
.manual-input input{flex:1;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:16px;outline:none}
.manual-input input:focus{border-color:var(--pri)}
.manual-input button{background:var(--pri);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap}

/* 商品情報カード */
.product-card{margin:8px;background:var(--card);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden}
.product-header{background:var(--pri2);color:#fff;padding:12px 14px}
.product-header .jan{font-size:11px;opacity:.8;margin-bottom:2px;font-family:monospace;letter-spacing:1px}
.product-header .name{font-size:17px;font-weight:700;line-height:1.3}
.product-header .spec{font-size:12px;opacity:.8;margin-top:2px}

.info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--border)}
.info-cell{padding:10px;text-align:center;border-right:1px solid var(--border)}
.info-cell:last-child{border-right:none}
.info-cell .label{font-size:10px;color:var(--txt2);margin-bottom:3px}
.info-cell .value{font-size:17px;font-weight:700}
.info-cell .value.price{color:var(--red)}
.info-cell .value.cost{color:var(--blue)}
.info-cell .value.margin{color:var(--green)}

.detail-rows{padding:0 14px}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.detail-row:last-child{border-bottom:none}
.detail-row .dl{color:var(--txt2)}
.detail-row .dv{font-weight:600}

/* タブ切替 */
.data-tabs{display:flex;gap:0;margin:8px;background:var(--card);border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.data-tab{flex:1;padding:8px 4px;text-align:center;font-size:12px;font-weight:600;border:none;background:var(--card);color:var(--txt2);cursor:pointer;border-right:1px solid var(--border)}
.data-tab:last-child{border-right:none}
.data-tab.active{background:var(--pri);color:#fff}

/* セクション */
.section-card{margin:0 8px 8px;background:var(--card);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden}
.section-title{padding:10px 14px;font-size:13px;font-weight:700;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.weekly-grid{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.wk-col{border-right:1px solid var(--border);padding:8px 4px}
.wk-col:last-child{border-right:none}
.wk-col .wh{font-size:10px;color:var(--txt2);margin-bottom:4px}
.wk-col .wv{font-size:15px;font-weight:700}
.wk-col .wa{font-size:11px;color:var(--txt2);margin-top:2px}

/* テーブル */
.data-table{width:100%;border-collapse:collapse;font-size:11px}
.data-table th{background:#f5f5f5;padding:6px 3px;text-align:center;font-size:10px;color:var(--txt2);font-weight:600;border-bottom:1px solid var(--border);position:sticky;top:0}
.data-table td{padding:5px 3px;text-align:right;border-bottom:1px solid #f5f5f5}
.data-table td:first-child{text-align:left;font-family:monospace;font-size:10px}
.data-table tr:nth-child(even){background:#fafafa}
.data-table td.positive{color:var(--green);font-weight:600}
.data-table td.negative{color:var(--red);font-weight:600}

/* 在庫グリッド */
.zaiko-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
.zaiko-cell{background:var(--card);padding:8px;text-align:center}
.zaiko-cell .zl{font-size:10px;color:var(--txt2);margin-bottom:2px}
.zaiko-cell .zv{font-size:18px;font-weight:700}
.zaiko-cell .zv.neg{color:var(--red)}
.zaiko-cell .zv.pos{color:var(--green)}

/* 店舗タブ */
.store-tabs{display:flex;gap:4px;padding:6px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.store-tab{padding:5px 10px;border-radius:16px;font-size:11px;white-space:nowrap;border:1px solid var(--border);background:var(--card);color:var(--txt2);cursor:pointer}
.store-tab.active{background:var(--pri);color:#fff;border-color:var(--pri)}

/* ステータス */
.status-bar{padding:12px;text-align:center;color:var(--txt2);font-size:12px}
.not-found{margin:20px 12px;text-align:center;padding:24px;background:var(--card);border-radius:12px}
.not-found .nf-icon{font-size:40px;margin-bottom:8px}
.not-found .nf-text{font-size:15px;font-weight:600;margin-bottom:4px}
.not-found .nf-sub{font-size:12px;color:var(--txt2)}

/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding:4px 0;padding-bottom:max(4px,env(safe-area-inset-bottom));z-index:100}
.bottom-nav .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;font-size:10px;color:var(--txt2);background:none;border:none}
.bottom-nav .nav-btn.active{color:var(--pri)}
.bottom-nav .nav-btn .icon{font-size:20px}
.content{padding-bottom:60px}

/* カメラOFF時 */
.camera-off{display:flex;align-items:center;justify-content:center;padding:24px 16px;background:#1a1a2e;color:#fff;height:200px}
.camera-off button{background:#00e676;color:#000;border:none;border-radius:8px;padding:12px 32px;font-size:15px;font-weight:600}

/* 統計ページ */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px}
.stat-card{background:var(--card);border-radius:12px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.stat-card .sv{font-size:22px;font-weight:700;color:var(--pri)}
.stat-card .sl{font-size:11px;color:var(--txt2);margin-top:4px}

/* 初期表示メッセージ */
.scan-prompt{text-align:center;padding:30px 16px;color:var(--txt2)}
.scan-prompt .sp-icon{font-size:40px;margin-bottom:6px;opacity:.5}
.scan-prompt .sp-text{font-size:13px}

/* 次をスキャンボタン（フローティング） */
.scan-next-btn{position:fixed;bottom:68px;left:50%;transform:translateX(-50%);background:#00c853;color:#fff;border:none;border-radius:24px;padding:10px 24px;font-size:14px;font-weight:700;box-shadow:0 3px 12px rgba(0,200,83,.4);z-index:99;animation:pulseBtn 2s infinite;cursor:pointer}
@keyframes pulseBtn{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}

/* 検索モード切替 */
.search-mode-tabs{display:flex;gap:0;background:var(--card);border-bottom:1px solid var(--border)}
.search-mode-tab{flex:1;padding:8px;text-align:center;font-size:12px;font-weight:600;border:none;background:var(--card);color:var(--txt2);cursor:pointer;border-bottom:2px solid transparent}
.search-mode-tab.active{color:var(--pri);border-bottom-color:var(--pri)}

/* 検索結果一覧 */
.search-results{margin:8px}
.search-result-item{background:var(--card);border-radius:10px;margin-bottom:6px;padding:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;border:1px solid var(--border);transition:background .15s}
.search-result-item:active{background:#e8eaf6}
.search-result-item .sr-name{font-size:14px;font-weight:600;line-height:1.3}
.search-result-item .sr-sub{font-size:11px;color:var(--txt2);margin-top:2px;display:flex;gap:8px}
.search-result-item .sr-prices{display:flex;gap:12px;margin-top:4px;font-size:13px}
.search-result-item .sr-prices .sr-sell{color:var(--red);font-weight:600}
.search-result-item .sr-prices .sr-cost{color:var(--blue)}
.search-result-item .sr-prices .sr-margin{color:var(--green)}
.search-count{padding:4px 12px;font-size:11px;color:var(--txt2)}

.hidden{display:none!important}
</style>
</head>
<body>

<div class="header">
  <h1>マルエー商品スキャン</h1>
  <select class="store-sel" id="storeSelect" onchange="onStoreChange()">
    <option value="">全店</option>
    <option value="5">泉店</option>
    <option value="6">平面店</option>
    <option value="7">旭南店</option>
    <option value="8">御所野店</option>
    <option value="9">酒田北店</option>
    <option value="10">鶴岡店</option>
    <option value="11">本荘石脇店</option>
    <option value="12">茨島店</option>
    <option value="13">鶴岡南店</option>
  </select>
</div>

<div class="content" id="mainContent">

  <!-- ========== スキャンタブ ========== -->
  <div id="scanSection">

    <!-- 1) スキャン成功バナー（最上部） -->
    <div class="scan-success-banner" id="scanBanner"></div>

    <!-- 2) 商品情報（スキャン後に表示） -->
    <div id="resultSection" class="hidden">
      <div class="product-card" id="productCard">
        <div class="product-header">
          <div class="jan" id="resJan"></div>
          <div class="name" id="resName"></div>
          <div class="spec" id="resSpec"></div>
        </div>
        <div class="info-grid">
          <div class="info-cell"><div class="label">税込売価</div><div class="value price" id="resTaxPrice">-</div></div>
          <div class="info-cell"><div class="label">原価</div><div class="value cost" id="resCost">-</div></div>
          <div class="info-cell"><div class="label">値入率</div><div class="value margin" id="resMargin">-</div></div>
        </div>
        <div class="detail-rows" id="detailRows"></div>
      </div>

      <!-- データ切替タブ -->
      <div class="data-tabs" id="dataTabs">
        <button class="data-tab active" onclick="switchDataTab('pos')">POS販売</button>
        <button class="data-tab" onclick="switchDataTab('ukebarai')">受払い</button>
        <button class="data-tab" onclick="switchDataTab('zaiko')">在庫</button>
        <button class="data-tab" onclick="switchDataTab('tanawari')">棚割り</button>
      </div>

      <!-- POS販売タブ -->
      <div id="posPanel">
        <div class="section-card">
          <div class="section-title">📊 週別販売推移</div>
          <div class="weekly-grid" id="weeklyGrid"></div>
        </div>
        <div class="section-card">
          <div class="section-title">📋 日別販売実績</div>
          <div class="store-tabs" id="storeTabs"></div>
          <div style="max-height:250px;overflow-y:auto">
            <table class="data-table"><thead>
              <tr><th>日付</th><th>数量</th><th>売上</th><th>値引</th></tr>
            </thead><tbody id="dailyBody"></tbody></table>
          </div>
        </div>
      </div>

      <!-- 受払いタブ -->
      <div id="ukebaraiPanel" class="hidden">
        <div class="section-card">
          <div class="section-title">📦 受払い明細</div>
          <div class="store-tabs" id="ukeStoreTabs"></div>
          <div style="max-height:350px;overflow-y:auto">
            <table class="data-table"><thead>
              <tr><th>日付</th><th>POS</th><th>発注</th><th>仕入</th><th>移入</th><th>移出</th><th>返品</th><th>廃棄</th></tr>
            </thead><tbody id="ukeBody"></tbody></table>
          </div>
        </div>
      </div>

      <!-- 在庫タブ -->
      <div id="zaikoPanel" class="hidden">
        <div class="section-card">
          <div class="section-title">📦 在庫状況（全店合計）</div>
          <div class="zaiko-grid" id="zaikoTotal"></div>
        </div>
        <div class="section-card">
          <div class="section-title">🏪 店舗別在庫</div>
          <div style="max-height:350px;overflow-y:auto">
            <table class="data-table"><thead>
              <tr><th>店舗</th><th>前日在</th><th>仕入</th><th>POS</th><th>理論在</th><th>当日在</th></tr>
            </thead><tbody id="zaikoBody"></tbody></table>
          </div>
        </div>
      </div>

      <!-- 棚割りタブ -->
      <div id="tanawariPanel" class="hidden">
        <div class="section-card">
          <div class="section-title">🗂 棚割り情報</div>
          <div id="tanawariContent"></div>
        </div>
      </div>
    </div>

    <!-- 未発見 -->
    <div id="notFoundSection" class="hidden">
      <div class="not-found">
        <div class="nf-icon">🔍</div>
        <div class="nf-text">商品が見つかりません</div>
        <div class="nf-sub" id="nfJan"></div>
      </div>
    </div>

    <!-- スキャン前の初期メッセージ -->
    <div id="scanPrompt" class="scan-prompt">
      <div class="sp-icon">👇</div>
      <div class="sp-text">下のカメラでバーコードをスキャン<br>または商品名で検索</div>
    </div>

    <!-- 検索結果一覧（名前検索時） -->
    <div id="searchResultsSection" class="hidden">
      <div class="search-count" id="searchCount"></div>
      <div class="search-results" id="searchResults"></div>
    </div>

    <!-- 3) 検索モード切替 + 入力 -->
    <div class="search-mode-tabs">
      <button class="search-mode-tab active" id="modeJan" onclick="setSearchMode('jan')">JANコード</button>
      <button class="search-mode-tab" id="modeName" onclick="setSearchMode('name')">商品名検索</button>
    </div>
    <div class="manual-input">
      <input type="tel" id="janInput" placeholder="JANコードを入力" maxlength="13"
             onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()" id="searchBtn">検索</button>
    </div>

    <!-- 4) カメラエリア（下部・コンパクト） -->
    <div class="camera-off" id="cameraOff">
      <button onclick="startCamera()">📷 カメラ起動</button>
    </div>
    <div class="scan-area-compact hidden" id="cameraOn">
      <div id="qr-reader" style="width:100%;height:200px"></div>
      <div class="scan-hint" id="scanHint">バーコードを枠内に合わせてください</div>
    </div>
    <!-- カメラ稼働中の補助テキスト -->
    <div id="cameraStatus" class="hidden" style="text-align:center;padding:6px;font-size:11px;color:var(--green);background:var(--card);border-bottom:1px solid var(--border)">
      🟢 カメラ稼働中 — 別の商品をスキャンできます
    </div>
  </div>

  <!-- ========== 統計ページ ========== -->
  <div id="statsSection" class="hidden" style="padding-top:8px">
    <div class="stats-grid" id="statsGrid"></div>
    <div style="padding:12px;text-align:center">
      <button onclick="triggerFtpSync()" style="background:var(--pri);color:#fff;border:none;border-radius:8px;padding:12px 32px;font-size:14px;font-weight:600" id="syncBtn">
        🔄 FTPデータ同期
      </button>
      <div id="syncStatus" style="margin-top:8px;font-size:12px;color:var(--txt2)"></div>
      <div id="syncScheduleInfo" style="margin-top:12px;padding:10px;background:#e8f5e9;border-radius:8px;font-size:12px;color:#2e7d32;text-align:left"></div>
    </div>
  </div>
</div>

<!-- 次をスキャンボタン -->
<button class="scan-next-btn hidden" id="scanNextBtn" onclick="scrollToCamera()">📷 次をスキャン ▼</button>

<div class="bottom-nav">
  <button class="nav-btn active" onclick="showTab('scan')" id="tabScan">
    <span class="icon">📷</span><span>スキャン</span>
  </button>
  <button class="nav-btn" onclick="showTab('stats')" id="tabStats">
    <span class="icon">📊</span><span>データ</span>
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
const API = '';
let currentJan = '';
let currentStore = '';
let cameraActive = false;
let html5QrCode = null;
let searchMode = 'jan'; // 'jan' or 'name'

// ===== ページ復帰時のカメラ再起動 =====
// ブラウザがバックグラウンドから戻った時にカメラを再起動
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) {
    // ページが再表示された
    var scanSection = document.getElementById('scanSection');
    if (scanSection && !scanSection.classList.contains('hidden')) {
      // スキャンタブが表示中なら、カメラ状態をチェックして必要なら再起動
      setTimeout(function() { restartCamera(); }, 500);
    }
  }
});

// 画面タッチでカメラが止まっていたら再起動（フォールバック）
var camEl = document.getElementById('cameraOn');
if (camEl) {
  camEl.addEventListener('click', function() {
    if (!cameraActive || !html5QrCode) {
      restartCamera();
    }
  });
}

// ===== スキャン成功音 =====
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 1200;
    gain.gain.value = 0.3;
    osc.start();
    osc.stop(ctx.currentTime + 0.12);
    setTimeout(() => {
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.frequency.value = 1600;
      gain2.gain.value = 0.3;
      osc2.start();
      osc2.stop(ctx.currentTime + 0.12);
    }, 120);
  } catch(e) {}
}

function showScanBanner(code) {
  const banner = document.getElementById('scanBanner');
  banner.textContent = '✅ ' + code;
  banner.classList.add('show');
  setTimeout(() => banner.classList.remove('show'), 1500);
}

// ===== タブ切替 =====
function showTab(tab) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
  document.getElementById('scanSection').classList.toggle('hidden', tab !== 'scan');
  document.getElementById('statsSection').classList.toggle('hidden', tab !== 'stats');
  if (tab === 'stats') {
    loadStats(); loadSyncSchedule();
    // データタブに切り替え時、カメラを停止（リソース解放）
    stopCamera();
  }
  if (tab === 'scan') {
    // スキャンタブに戻った時、カメラを自動再起動
    setTimeout(function() { restartCamera(); }, 300);
  }
}

// ===== データタブ切替 =====
function switchDataTab(tab) {
  document.querySelectorAll('.data-tab').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('posPanel').classList.toggle('hidden', tab !== 'pos');
  document.getElementById('ukebaraiPanel').classList.toggle('hidden', tab !== 'ukebarai');
  document.getElementById('zaikoPanel').classList.toggle('hidden', tab !== 'zaiko');
  document.getElementById('tanawariPanel').classList.toggle('hidden', tab !== 'tanawari');
  if (tab === 'ukebarai' && currentJan) loadUkebarai(currentJan);
  if (tab === 'zaiko' && currentJan) loadZaiko(currentJan);
  if (tab === 'tanawari' && currentJan) loadTanawari(currentJan);
}

function switchDataTabDirect(tab) {
  document.querySelectorAll('.data-tab').forEach(b => b.classList.remove('active'));
  var labels = {pos:'POS', ukebarai:'受払', zaiko:'在庫', tanawari:'棚割'};
  document.querySelectorAll('.data-tab').forEach(b => {
    if(b.textContent.includes(labels[tab]||'')) b.classList.add('active');
  });
  document.getElementById('posPanel').classList.toggle('hidden', tab !== 'pos');
  document.getElementById('ukebaraiPanel').classList.toggle('hidden', tab !== 'ukebarai');
  document.getElementById('zaikoPanel').classList.toggle('hidden', tab !== 'zaiko');
  document.getElementById('tanawariPanel').classList.toggle('hidden', tab !== 'tanawari');
}

function onStoreChange() {

// ===== カメラ起動 =====
var cameraStarting = false;  // 二重起動防止

function startCamera() {
  if (cameraStarting) return;
  cameraStarting = true;

  document.getElementById('cameraOff').classList.add('hidden');
  document.getElementById('cameraOn').classList.remove('hidden');

  // 既存インスタンスを確実にクリーンアップ
  _cleanupCamera();

  // DOMもリセット（html5-qrcodeがvideoタグを残すことがある）
  var reader = document.getElementById('qr-reader');
  if (reader) reader.innerHTML = '';

  // 少し待ってからカメラ起動（DOM更新を確実に反映）
  setTimeout(function() {
    html5QrCode = new Html5Qrcode("qr-reader");
    var config = {
      fps: 10, qrbox: { width: 250, height: 100 },
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.ITF
      ]
    };
    html5QrCode.start(
      { facingMode: "environment" }, config,
      function(decodedText) { if (decodedText && decodedText.length >= 4) onBarcodeDetected(decodedText); },
      function() {}
    ).then(function() {
      cameraActive = true;
      cameraStarting = false;
      document.getElementById('cameraStatus').classList.remove('hidden');
      document.getElementById('scanHint').textContent = 'バーコードを枠内に合わせてください';
    }).catch(function(err) {
      console.error('Camera error:', err);
      cameraStarting = false;
      cameraActive = false;
      document.getElementById('cameraOff').classList.remove('hidden');
      document.getElementById('cameraOn').classList.add('hidden');
      document.getElementById('cameraStatus').classList.add('hidden');
      alert('カメラにアクセスできません。手動入力をご利用ください。');
    });
  }, 100);
}

function _cleanupCamera() {
  if (html5QrCode) {
    try {
      var state = html5QrCode.getState();
      if (state === Html5QrcodeScannerState.SCANNING || state === Html5QrcodeScannerState.PAUSED) {
        html5QrCode.stop().then(function() {
          try { html5QrCode.clear(); } catch(e) {}
        }).catch(function() {});
      } else {
        try { html5QrCode.clear(); } catch(e) {}
      }
    } catch(e) {
      try { html5QrCode.stop().catch(function(){}); } catch(e2) {}
    }
    html5QrCode = null;
  }
  cameraActive = false;
}

function restartCamera() {
  // スキャンタブに戻った時等の再起動用
  // カメラが既に正常稼働中ならスキップ
  if (cameraActive && html5QrCode) {
    try {
      var state = html5QrCode.getState();
      if (state === Html5QrcodeScannerState.SCANNING) return;  // 正常動作中
    } catch(e) {}
  }
  // カメラが停止しているか異常 → 再起動
  _cleanupCamera();
  var reader = document.getElementById('qr-reader');
  if (reader) reader.innerHTML = '';
  startCamera();
}

let lastScannedCode = '';
let lastScannedTime = 0;

function normalizeBarcode(code) {
  // UPC-A(12桁)で読まれた場合、先頭に0を付けてEAN-13に変換
  // 例: 221425000998 → 0221425000998
  if (code.length === 12 && /^\d+$/.test(code)) {
    code = '0' + code;
  }
  return code;
}

function onBarcodeDetected(code) {
  code = normalizeBarcode(code);
  const now = Date.now();
  // 同じコードは3秒間無視、違うコードは即座に反応
  if (code === lastScannedCode && now - lastScannedTime < 3000) return;
  lastScannedCode = code;
  lastScannedTime = now;

  // フィードバック
  playBeep();
  if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
  showScanBanner(code);

  document.getElementById('janInput').value = code;
  document.getElementById('scanHint').textContent = '読取成功: ' + code;
  searchProduct();

  // 3秒後に同じコードを再スキャン可能にする
  setTimeout(() => { if (lastScannedCode === code) lastScannedCode = ''; }, 3000);
}

function scrollToCamera() {
  lastScannedCode = '';  // リセットして即スキャン可能に
  document.getElementById('scanNextBtn').classList.add('hidden');

  // カメラが正常スキャン中かチェック
  var isScanning = false;
  if (cameraActive && html5QrCode) {
    try {
      var state = html5QrCode.getState();
      isScanning = (state === Html5QrcodeScannerState.SCANNING);
    } catch(e) {}
  }

  if (isScanning) {
    // 正常動作中 → スクロールのみ
    var cam = document.getElementById('cameraOn');
    if (cam) cam.scrollIntoView({ behavior: 'smooth', block: 'center' });
  } else {
    // カメラが停止状態 → 完全再起動
    restartCamera();
    setTimeout(function() {
      var c = document.getElementById('cameraOn');
      if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 600);
  }
}

function stopCamera() {
  _cleanupCamera();
  document.getElementById('cameraStatus').classList.add('hidden');
  document.getElementById('cameraOff').classList.remove('hidden');
  document.getElementById('cameraOn').classList.add('hidden');
}

// ===== 検索モード =====
function setSearchMode(mode) {
  searchMode = mode;
  document.getElementById('modeJan').classList.toggle('active', mode === 'jan');
  document.getElementById('modeName').classList.toggle('active', mode === 'name');
  const input = document.getElementById('janInput');
  if (mode === 'jan') {
    input.type = 'tel';
    input.placeholder = 'JANコードを入力';
    input.maxLength = 13;
  } else {
    input.type = 'text';
    input.placeholder = '商品名・メーカー名を入力';
    input.maxLength = 50;
  }
  input.value = '';
  input.focus();
}

function doSearch() {
  if (searchMode === 'name') {
    searchByName();
  } else {
    searchProduct();
  }
}

// ===== 商品名検索 =====
function searchByName() {
  const q = document.getElementById('janInput').value.trim();
  if (!q || q.length < 2) { alert('2文字以上入力してください'); return; }

  document.getElementById('resultSection').classList.add('hidden');
  document.getElementById('notFoundSection').classList.add('hidden');
  document.getElementById('scanPrompt').classList.add('hidden');
  document.getElementById('searchResultsSection').classList.remove('hidden');
  document.getElementById('searchResults').innerHTML = '<div style="text-align:center;padding:20px;color:var(--txt2)">検索中...</div>';
  document.getElementById('searchCount').textContent = '';

  fetch(API + '/api/scan/search?q=' + encodeURIComponent(q))
    .then(r => r.json())
    .then(data => {
      if (data.error) { alert(data.error); return; }
      const results = data.results || [];
      document.getElementById('searchCount').textContent = results.length > 0
        ? `${data.count}件ヒット（最大50件表示）`
        : '該当商品なし';

      if (!results.length) {
        document.getElementById('searchResults').innerHTML =
          '<div style="text-align:center;padding:20px;color:var(--txt2)">「' + q + '」に該当する商品が見つかりません</div>';
        return;
      }

      document.getElementById('searchResults').innerHTML = results.map(r => {
        const sell = r.tax_price || r.sell_price || 0;
        const cost = r.cost || 0;
        const margin = r.margin_rate || 0;
        return '<div class="search-result-item" onclick="selectSearchResult(\'' + r.jan + '\')">' +
          '<div class="sr-name">' + (r.product_name||'不明') + '</div>' +
          '<div class="sr-sub"><span>JAN: ' + r.jan + '</span><span>' + (r.spec||'') + '</span></div>' +
          '<div class="sr-prices">' +
            '<span class="sr-sell">¥' + sell.toLocaleString() + '</span>' +
            (cost > 0 ? '<span class="sr-cost">原価¥' + Math.round(cost).toLocaleString() + '</span>' : '') +
            (margin > 0 ? '<span class="sr-margin">' + margin + '%</span>' : '') +
          '</div></div>';
      }).join('');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    })
    .catch(err => alert('通信エラー: ' + err.message));
}

function selectSearchResult(jan) {
  document.getElementById('searchResultsSection').classList.add('hidden');
  document.getElementById('janInput').value = jan;
  searchMode = 'jan';
  document.getElementById('modeJan').classList.add('active');
  document.getElementById('modeName').classList.remove('active');
  const input = document.getElementById('janInput');
  input.type = 'tel'; input.placeholder = 'JANコードを入力'; input.maxLength = 13;
  searchProduct();
}

// ===== 商品検索（JAN） =====
function searchProduct() {
  var jan = document.getElementById('janInput').value.trim();
  if (!jan) return;
  jan = normalizeBarcode(jan);
  document.getElementById('janInput').value = jan;
  document.getElementById('resultSection').classList.add('hidden');
  document.getElementById('notFoundSection').classList.add('hidden');
  document.getElementById('scanPrompt').classList.add('hidden');
  document.getElementById('searchResultsSection').classList.add('hidden');

  fetch(API + '/api/scan/product?jan=' + encodeURIComponent(jan))
    .then(r => {
      if (r.status === 404) {
        currentJan = '';
        document.getElementById('notFoundSection').classList.remove('hidden');
        document.getElementById('nfJan').textContent = 'JAN: ' + jan;
        return null;
      }
      return r.json();
    })
    .then(data => {
      if (!data || data.error) return;
      // インストア商品の場合、DB上のJANを使う（POS・受払い等の検索用）
      currentJan = data.matched_jan || data.jan || jan;
      displayProduct(data);
      loadHistory(currentJan);
      switchDataTabDirect('pos');
      // 商品情報が見えるようにスクロール
      window.scrollTo({ top: 0, behavior: 'smooth' });
      // カメラが起動中なら「次をスキャン」ボタンを表示
      if (cameraActive) {
        setTimeout(() => {
          document.getElementById('scanNextBtn').classList.remove('hidden');
        }, 500);
      }
    })
    .catch(err => alert('通信エラー: ' + err.message));
}

// ===== 商品情報表示 =====

  document.getElementById('resJan').textContent = 'JAN: ' + p.jan;
  document.getElementById('resName').textContent = p.product_name || '不明';
  document.getElementById('resSpec').textContent = p.spec || '';

  // インストア商品: バーコードから抽出した実売価格を表示
  var displayPrice, displayCost, displayMargin;
  if (p.is_instore && p.instore_price) {
    displayPrice = '¥' + p.instore_price.toLocaleString();
    displayCost = p.cost > 0 ? '¥' + Math.round(p.cost).toLocaleString() : '-';
    displayMargin = p.margin_rate > 0 ? p.margin_rate + '%' : '-';
  } else {
    var tp = p.tax_price || p.sell_price || 0;
    displayPrice = tp > 0 ? '¥' + tp.toLocaleString() : '-';
    displayCost = p.cost > 0 ? '¥' + Math.round(p.cost).toLocaleString() : '-';
    displayMargin = p.margin_rate > 0 ? p.margin_rate + '%' : '-';
  }
  document.getElementById('resTaxPrice').textContent = displayPrice;
  document.getElementById('resCost').textContent = displayCost;

  } else {
    details.push(['本体売価', p.sell_price > 0 ? '¥' + p.sell_price.toLocaleString() : '-']);
  }
  details.push(['分類', p.dept_code || '-']);
  details.push(['仕入先', p.supplier_code || '-']);

  document.getElementById('detailRows').innerHTML = details.map(d =>
    '<div class="detail-row"><span class="dl">' + d[0] + '</span><span class="dv">' + d[1] + '</span></div>'
  ).join('');

function loadHistory(jan) {
  const store = currentStore;

  fetch(url).then(r => r.json()).then(data => {

function displayWeekly(weekly) {
  const grid = document.getElementById('weeklyGrid');

function displayDaily(detail, daily, storeNames) {
  const tabs = document.getElementById('storeTabs');
  const stores = [...new Set(detail.map(r => r.store_code))].sort((a,b) => Number(a)-Number(b));
  tabs.innerHTML = '<div class="store-tab active" onclick="filterDailyStore(this,\'\')">全店</div>' +
    stores.map(s => '<div class="store-tab" onclick="filterDailyStore(this,\'' + s + '\')">' + (storeNames[s]||'店'+s) + '</div>').join('');

  window._dailyAgg = daily;
  renderDailyTable('');

function filterDailyStore(el, store) {
  el.parentNode.querySelectorAll('.store-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderDailyTable(store);
}

function renderDailyTable(store) {
  const body = document.getElementById('dailyBody');
  let rows;
  if (!store) {
    rows = (window._dailyAgg||[]).map(d => ({date:d.date, qty:d.total_qty, amount:d.total_amount, discount:0}));
  } else {
    rows = (window._dailyDetail||[]).filter(r => r.store_code===store).map(r => ({date:r.date, qty:r.sales_qty, amount:r.sales_amount, discount:r.discount_amount}));
  }
  if (!rows.length) { body.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--txt2);padding:12px">データなし</td></tr>'; return; }
  body.innerHTML = rows.map(r => {
    const d = r.date.length===8 ? r.date.substring(4,6)+'/'+r.date.substring(6,8) : r.date.substring(5).replace('-','/');
    return '<tr><td>'+d+'</td><td>'+r.qty+'</td><td>¥'+r.amount.toLocaleString()+'</td><td>'+(r.discount>0?'¥'+r.discount.toLocaleString():'-')+'</td></tr>';
  }).join('');
}

      '<div class="stat-card"><div class="sv">'+(d.ukebarai_count||0).toLocaleString()+'</div><div class="sl">受払いレコード</div></div>' +
      '<div class="stat-card"><div class="sv">'+(d.zaiko_count||0).toLocaleString()+'</div><div class="sl">在庫レコード</div></div>' +
      '<div class="stat-card"><div class="sv">'+df+'</div><div class="sl">データ開始日</div></div>' +
      '<div class="stat-card"><div class="sv">'+dt+'</div><div class="sl">データ最終日</div></div>';
  }).catch(() => {});
}

function triggerFtpSync() {
  const btn = document.getElementById('syncBtn');
  btn.disabled = true; btn.textContent = '⏳ 同期中...';
  document.getElementById('syncStatus').textContent = 'FTPサーバに接続しています...';
  fetch(API + '/api/ftp-sync', { method: 'POST' }).then(r => r.json()).then(d => {
    if (d.error) {
      document.getElementById('syncStatus').textContent = d.error;
      btn.disabled = false; btn.textContent = '🔄 FTPデータ同期';
      return;
    }
    pollSync();
  }).catch(e => {
    document.getElementById('syncStatus').textContent = 'エラー: ' + e.message;
    btn.disabled = false; btn.textContent = '🔄 FTPデータ同期';
  });
}

function pollSync() {
  fetch(API + '/api/ftp-sync/status').then(r => r.json()).then(d => {
    const st = document.getElementById('syncStatus');
    if (d.log && d.log.length) st.textContent = d.log[d.log.length - 1];
    if (d.running) { setTimeout(pollSync, 2000); }
    else {
      const btn = document.getElementById('syncBtn');
      btn.disabled = false; btn.textContent = '🔄 FTPデータ同期';
      if (d.last_result && d.last_result.success) {
        const r = d.last_result;
        st.textContent = '✅ 完了: 商品 '+(r.scan_products||0).toLocaleString()+
          '件, POS '+(r.scan_pos||0).toLocaleString()+
          '件, 受払 '+(r.scan_ukebarai||0).toLocaleString()+
          '件, 在庫 '+(r.scan_zaiko||0).toLocaleString()+'件';
        loadStats();
      } else {
        const errMsg = (d.last_result && d.last_result.error) ? d.last_result.error : '不明なエラー';
        st.textContent = '❌ ' + errMsg;
      }
    }
  }).catch(() => setTimeout(pollSync, 3000));
}

// ===== 同期スケジュール表示 =====
function loadSyncSchedule() {
  fetch(API + '/api/sync-schedule').then(r => r.json()).then(d => {
    const el = document.getElementById('syncScheduleInfo');
    if (!el) return;
    let html = '🕐 <b>自動同期:</b> ' + (d.schedule || '未設定');
    if (d.last_sync) html += '<br>📅 前回同期: ' + d.last_sync;
    if (d.last_result && d.last_result.success) {
      html += ' ✅';
    } else if (d.last_result && d.last_result.error) {
      html += ' ❌ ' + d.last_result.error;
    }
    html += '<br>🕐 サーバー時刻(JST): ' + d.current_time_jst;
    el.innerHTML = html;
  }).catch(() => {});
}

// ===== Service Worker =====
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
